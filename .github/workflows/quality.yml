name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mindforge
          POSTGRES_PASSWORD: mindforge
          POSTGRES_DB: mindforge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mindforge"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://mindforge:mindforge@localhost:5432/mindforge?schema=public
      DIRECT_URL: postgresql://mindforge:mindforge@localhost:5432/mindforge?schema=public
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      OPENAI_API_KEY: ci-placeholder
      RATE_LIMIT_HASH_SECRET: ci-only-rate-limit-secret-that-is-longer-than-thirty-two-characters
      NEXT_PUBLIC_SUPPORT_EMAIL: support@example.com
      CRON_SECRET: ci-only-retention-secret
      AUDIT_RETENTION_DAYS: "365"
      TRUSTED_PROXY_HEADER: x-forwarded-for
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit:prod
      - run: pnpm db:generate
      - run: pnpm prisma migrate deploy
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e:public

  staging-auth:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: staging
    env:
      PLAYWRIGHT_BASE_URL: ${{ vars.STAGING_BASE_URL }}
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e:staging
